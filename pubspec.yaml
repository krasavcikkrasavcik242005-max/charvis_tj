name: charvis_tj_ultimate
description: "Charvis TJ Ultimate Voice Assistant and System Manager"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Китобхонаҳо барои фаъолияти овозӣ, интернет, пайвастшавӣ ва ҳуқуқҳо
  speech_to_text: ^6.6.0
  flutter_tts: ^3.8.5
  http: ^1.2.0
  url_launcher: ^6.2.4
  permission_handler: ^11.3.0

  # Иконаҳои стандартӣ
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Пайваст кардани папкаи тасвирҳо ва фонҳо ба лоиҳа
  assets:
    - assets/images/
    - assets/images/tajik_icon.png
    - assets/images/charvis_bg_neon.png
    - assets/images/charvis_matrix_cyber.png
    - assets/images/charvis_hologram.png
    - assets/images/charvis_dark_core.png
